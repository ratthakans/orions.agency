<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Speed up third-party connections (analytics + embedded video) -->
    <link rel="preconnect" href="https://plausible.io" crossorigin />
    <link rel="preconnect" href="https://www.youtube-nocookie.com" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <meta name="theme-color" content="#0E0E0E" />
    <meta name="author" content="ØRIONS" />
    <!-- title · description · robots · canonical · Open Graph · Twitter are emitted
         per-route by the <SEO> component (vite-react-ssg <Head>) and prerendered into
         each page. Static copies here would duplicate (and go stale) on every URL. -->

    <!-- Plausible analytics (privacy-friendly, no cookie banner needed) -->
    <script defer data-domain="orions.agency" src="https://plausible.io/js/script.js"></script>
    <script>window.plausible=window.plausible||function(){(window.plausible.q=window.plausible.q||[]).push(arguments)}</script>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ØRIONS",
      "legalName": "ORIONS Creative Co., Ltd.",
      "url": "https://orions.agency",
      "logo": "https://orions.agency/favicon.jpg",
      "slogan": "Stories, refined.",
      "description": "ORIONS is a boutique creative company that helps brands uncover, refine and express the stories that make them worth remembering. We uncover what matters about a brand, refine it into a clear creative idea, and bring it to life across identity, campaigns, film and digital experiences.",
      "founder": {
        "@type": "Person",
        "name": "Ratthakan Suwanphakdee",
        "jobTitle": "Founder & Creative Director"
      },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "41/175 Soi Nawamin 111 Yaek 3",
        "addressLocality": "Nawamin, Bueng Kum",
        "addressRegion": "Bangkok",
        "postalCode": "10240",
        "addressCountry": "TH"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+66-89-354-2628",
        "email": "hello@orions.agency",
        "contactType": "customer service",
        "availableLanguage": ["English", "Thai"]
      },
      "foundingDate": "2025",
      "taxID": "0105568063442",
      "areaServed": { "@type": "Country", "name": "Thailand" },
      "knowsAbout": [
        "Creative direction", "Brand strategy", "Brand identity",
        "Big idea campaigns", "Art direction", "Brand film",
        "Video production", "Music video production", "Photography", "Rebranding"
      ],
      "sameAs": [
        "https://www.instagram.com/orions.agency",
        "https://www.facebook.com/orions.agency",
        "https://line.me/ti/p/~orions"
      ]
    }
    </script>

    <!-- JSON-LD: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "ØRIONS — Creative Agency",
      "description": "ORIONS is a story-led creative company. We uncover what matters about a brand, refine it into a clear creative idea, and bring it to life across identity, campaigns, film and digital experiences.",
      "slogan": "Stories, refined.",
      "priceRange": "$$$",
      "image": "https://orions.agency/og.jpg",
      "url": "https://orions.agency",
      "telephone": "+66-89-354-2628",
      "email": "hello@orions.agency",
      "sameAs": [
        "https://www.instagram.com/orions.agency",
        "https://www.facebook.com/orions.agency",
        "https://line.me/ti/p/~orions"
      ],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "41/175 Soi Nawamin 111 Yaek 3",
        "addressLocality": "Nawamin, Bueng Kum",
        "addressRegion": "Bangkok",
        "postalCode": "10240",
        "addressCountry": "TH"
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        "opens": "09:00",
        "closes": "18:00"
      },
      "areaServed": "Thailand",
      "knowsLanguage": ["Thai", "English"],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Creative Services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Story — Find what matters.", "url": "https://orions.agency/practice#story" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Direction — Shape how the story should feel.", "url": "https://orions.agency/practice#direction" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Expression — Bring the story into the world.", "url": "https://orions.agency/practice#expression" } }
        ]
      }

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ØRIONS",
      "alternateName": "ØRIONS — Creative Agency",
      "description": "A story-led creative company in Bangkok. Stories, refined.",
      "url": "https://orions.agency",
      "inLanguage": "th-TH",
      "publisher": { "@type": "Organization", "name": "ØRIONS", "url": "https://orions.agency" }
    }
    </script>

    <!-- Fail-safe: scroll-reveal blocks start at opacity:0 and are revealed by JS.
         With JS disabled, force them visible so no content is ever lost. -->
    <noscript>
      <style>.reveal-root{opacity:1!important;transform:none!important}</style>
    </noscript>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
